<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mind Mapr — Student Revision Platform</title>
    <meta
      name="description"
      content="Mind Mapr is a student revision platform that helps students organize study materials, create summaries, build mind maps, practice with flashcards and quizzes, and plan revision."
    />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('mindmapr_theme_v1') || 'light';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');
          if (isDark) root.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
