# Mind Mapr Backend Configuration
spring.application.name=mindmapr-backend

# Server Port
server.port=8080

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:3000

# Management / Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
